[project]
name = "ml-backtester"
version = "0.1.0"
description = "ML signal -> position -> backtest pipeline with purge/embargo walk-forward validation."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "yfinance>=0.2.40",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "lightgbm>=4.3",
    "pyarrow>=15.0",
    "matplotlib>=3.8",
    "streamlit>=1.38",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "black>=24.0",
    "ruff>=0.4",
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ml_backtester*", "app*"]
